plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.jetbrains.kotlin.android'
}

android {
    useLibrary("org.apache.http.legacy")
    namespace 'com.tv.remote.smarttv.control.smartcast.vizio'
    compileSdk 36
    

    defaultConfig {
        applicationId "com.tv.remote.smarttv.control.smartcast.vizio"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        dataBinding.enable true
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"https://api.example.com/\""
        resourceConfigurations += ['en']
    }

    viewBinding {
        enabled = true
    }
    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_20
        targetCompatibility JavaVersion.VERSION_20
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.yodo1.mas:lite:4.8.7'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.google.android.gms:play-services-cast:21.5.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.android.volley:volley:1.2.1'
//    implementation 'com.stanfy:gson-xml-java:0.1.7'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.github.bumptech.glide:glide:5.0.5'
//    implementation 'com.github.bumptech.glide:compiler:4.16.0'
//    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'io.github.chaosleung:pinview:1.4.4'
    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    implementation platform('com.google.firebase:firebase-bom:34.4.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:24.7.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.4'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.0.0"
    implementation("com.google.android.ump:user-messaging-platform:3.2.0")

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
//    implementation "com.github.ConnectSDK:Connect-SDK-Android:2.0.0"
    implementation 'androidx.mediarouter:mediarouter:1.8.1'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
}