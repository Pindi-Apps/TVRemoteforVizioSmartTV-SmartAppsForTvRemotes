plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    // org.jetbrains.kotlin.android removed: AGP 9+ compiles Kotlin with built-in Kotlin support.
}

android {
    useLibrary("org.apache.http.legacy")
    namespace 'com.tv.remote.smarttv.control.smartcast.vizio'
    // compileSdk raised from 36 to 37: Glide 5.0.9 AAR metadata requires minCompileSdk 37.
    compileSdk 37


    defaultConfig {
        applicationId "com.tv.remote.smarttv.control.smartcast.vizio"
        minSdk 24
        targetSdk 36
        versionCode 50
        versionName "50"
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"https://api.example.com/\""
    }

    androidResources {
        localeFilters += ['en']
    }

    buildFeatures {
        buildConfig true
        dataBinding true
        viewBinding true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_20
        targetCompatibility JavaVersion.VERSION_20
    }
}

kotlin {
    compilerOptions {
        // Keep Kotlin bytecode target aligned with compileOptions (Java 20).
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_20
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.8.0'
    // Held at 4.8.7: lite 4.9.0+ pulls ironSource (android-sdk.is.com) and Mintegral repos;
    // android-sdk.is.com does not resolve on this machine's DNS. See upgrade report.
    implementation 'com.yodo1.mas:lite:4.8.7'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.google.android.gms:play-services-cast:22.3.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.android.volley:volley:1.2.1'
//    implementation 'com.stanfy:gson-xml-java:0.1.7'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation 'com.github.bumptech.glide:glide:5.0.9'
//    implementation 'com.github.bumptech.glide:compiler:4.16.0'
//    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'io.github.chaosleung:pinview:1.4.4'
    implementation 'com.squareup.okhttp:okhttp:2.7.5'
    implementation platform('com.google.firebase:firebase-bom:35.0.1')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.android.gms:play-services-ads:25.5.0'
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    // kotlin-stdlib-jdk8 removed: deprecated (merged into kotlin-stdlib since 1.8); the Kotlin
    // Gradle plugin adds kotlin-stdlib automatically, matching the KGP version.
    implementation("com.google.android.ump:user-messaging-platform:4.0.0")
    implementation 'com.android.billingclient:billing:9.1.0'

    implementation 'org.nanohttpd:nanohttpd:2.3.1'
//    implementation "com.github.ConnectSDK:Connect-SDK-Android:2.0.0"
    implementation 'androidx.mediarouter:mediarouter:1.8.1'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
